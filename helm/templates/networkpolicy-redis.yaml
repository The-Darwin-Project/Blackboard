# BlackBoard/helm/templates/networkpolicy-redis.yaml
# @ai-rules:
# 1. [Constraint]: Restrict Redis ingress strictly to Brain and Reconciler pods.
# 2. [Pattern]: Ingress from podSelector matching darwin.selectorLabels.
# 3. [Gotcha]: Pod selector must match darwin.redisSelectorLabels.
{{- if .Values.redis.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-redis-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "darwin.redisLabels" . | nindent 4 }}
    app.kubernetes.io/component: network-security
spec:
  podSelector:
    matchLabels:
      {{- include "darwin.redisSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "darwin.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.redis.port | default 6379 }}
{{- end }}

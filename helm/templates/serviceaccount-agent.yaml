# BlackBoard/helm/templates/serviceaccount-agent.yaml
# Dedicated unprivileged ServiceAccount for ephemeral on-call and squad TaskRuns.
# Replaces overprivileged darwin-brain SA to prevent agent privilege escalation.
{{- if .Values.ephemeralAgents.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "darwin.ephemeralLabels" . | nindent 4 }}
    app.kubernetes.io/name: darwin-agent
{{- end }}

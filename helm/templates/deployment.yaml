# BlackBoard/helm/templates/deployment.yaml
{{- include "darwin.validateSidecars" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-brain
  labels:
    {{- include "darwin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "darwin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Trigger rollout on app ConfigMap changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "darwin.selectorLabels" . | nindent 8 }}
    spec:
      {{- if or .Values.observer.enabled .Values.slackAccess.enabled .Values.ephemeralAgents.enabled }}
      serviceAccountName: {{ .Release.Name }}-brain
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        # =================================================================
        # Brain Container (FastAPI)
        # =================================================================
        - name: brain
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # Redis connection (standalone deployment)
            - name: REDIS_HOST
              value: "{{ .Values.redis.host | default (printf "%s-redis" .Release.Name) }}"
            - name: REDIS_PORT
              value: "{{ .Values.redis.port | default 6379 }}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: password
            # GCP configuration
            - name: GCP_PROJECT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: GCP_PROJECT
            - name: GCP_LOCATION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: GCP_LOCATION
            - name: CLOUD_ML_REGION
              value: "{{ .Values.gcp.location }}"
            # LLM configuration (per-component)
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_PROVIDER
            - name: LLM_MODEL_BRAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MODEL_BRAIN
            - name: LLM_TEMPERATURE_BRAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_TEMPERATURE_BRAIN
            - name: LLM_MAX_TOKENS_BRAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MAX_TOKENS_BRAIN
            - name: LLM_MODEL_ALIGNER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MODEL_ALIGNER
            - name: LLM_TEMPERATURE_ALIGNER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_TEMPERATURE_ALIGNER
            - name: LLM_THINKING_ALIGNER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_THINKING_ALIGNER
            - name: LLM_MAX_TOKENS_ALIGNER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MAX_TOKENS_ALIGNER
            - name: LLM_MODEL_ARCHIVIST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MODEL_ARCHIVIST
            - name: LLM_TEMPERATURE_ARCHIVIST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_TEMPERATURE_ARCHIVIST
            - name: LLM_THINKING_ARCHIVIST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_THINKING_ARCHIVIST
            - name: LLM_MAX_TOKENS_ARCHIVIST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MAX_TOKENS_ARCHIVIST
            - name: LLM_MAX_TOKENS_ARCHIVIST_CLAUDE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MAX_TOKENS_ARCHIVIST_CLAUDE
            - name: LLM_MAX_TOKENS_ARCHIVIST_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MAX_TOKENS_ARCHIVIST_DIGEST
            # AI Transparency & Compliance
            - name: DARWIN_CONTACT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DARWIN_CONTACT_EMAIL
            - name: DARWIN_FEEDBACK_FORM_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DARWIN_FEEDBACK_FORM_URL
            # Agent dispatch configuration (Brain-level)
            - name: BRAIN_PROGRESSIVE_SKILLS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: BRAIN_PROGRESSIVE_SKILLS
            - name: SYSADMIN_DRY_RUN
              value: "{{ .Values.app.dryRun }}"
            - name: SYSADMIN_AUTO_APPROVE
              value: "{{ .Values.app.autoApprove }}"
            - name: GIT_REPO_PATH
              value: "{{ .Values.app.gitRepoPath }}"
            - name: AGENT_WS_MODE
              value: {{ .Values.app.agentWsMode | quote }}
            - name: BRAIN_MAX_CONCURRENT_DISPATCHES
              value: {{ .Values.app.maxConcurrentDispatches | default 0 | quote }}
            - name: MAX_ACTIVE_EVENTS
              value: {{ .Values.app.maxActiveEvents | default 20 | quote }}
            - name: AGENT_RESULT_MAX_CHARS
              value: {{ .Values.app.agentResultMaxChars | default "100000" | quote }}
            {{- if .Values.brain }}
            - name: BRAIN_RECONCILE_WORKERS
              value: {{ .Values.brain.reconcileWorkers | default 0 | quote }}
            - name: BRAIN_CONTENT_BUDGET_TOKENS
              value: {{ .Values.brain.contentBudgetTokens | default "800000" | quote }}
            - name: BRAIN_FULL_TIER_MAX_CHARS
              value: {{ .Values.brain.fullTierMaxChars | default "100000" | quote }}
            - name: LLM_STREAM_TTFB_TIMEOUT_SEC
              value: {{ if and (hasKey .Values.brain "streamTtfbTimeoutSec") (not (kindIs "invalid" .Values.brain.streamTtfbTimeoutSec)) (ne (toString .Values.brain.streamTtfbTimeoutSec) "") }}{{ .Values.brain.streamTtfbTimeoutSec | quote }}{{ else }}"600"{{ end }}
            - name: LLM_STREAM_INTER_CHUNK_TIMEOUT_SEC
              value: {{ if and (hasKey .Values.brain "streamInterChunkTimeoutSec") (not (kindIs "invalid" .Values.brain.streamInterChunkTimeoutSec)) (ne (toString .Values.brain.streamInterChunkTimeoutSec) "") }}{{ .Values.brain.streamInterChunkTimeoutSec | quote }}{{ else }}"60"{{ end }}
            - name: LLM_STREAM_TOTAL_TIMEOUT_SEC
              value: {{ if and (hasKey .Values.brain "streamTotalTimeoutSec") (not (kindIs "invalid" .Values.brain.streamTotalTimeoutSec)) (ne (toString .Values.brain.streamTotalTimeoutSec) "") }}{{ .Values.brain.streamTotalTimeoutSec | quote }}{{ else }}"1200"{{ end }}
            - name: LLM_HTTP_TIMEOUT_SEC
              value: {{ if and (hasKey .Values.brain "httpTimeoutSec") (not (kindIs "invalid" .Values.brain.httpTimeoutSec)) (ne (toString .Values.brain.httpTimeoutSec) "") }}{{ .Values.brain.httpTimeoutSec | quote }}{{ else }}"1500"{{ end }}
            - name: LLM_STREAM_SDK_RETRY_ATTEMPTS
              value: {{ if and (hasKey .Values.brain "streamSdkRetryAttempts") (not (kindIs "invalid" .Values.brain.streamSdkRetryAttempts)) (ne (toString .Values.brain.streamSdkRetryAttempts) "") }}{{ .Values.brain.streamSdkRetryAttempts | quote }}{{ else }}"1"{{ end }}
            {{- end }}
            {{- if or .Values.sidecars.architect.enabled .Values.sidecars.sysadmin.enabled .Values.sidecars.developer.enabled }}
            # Agent sidecar URLs
            - name: ARCHITECT_SIDECAR_URL
              value: "http://localhost:{{ .Values.sidecars.architect.port }}"
            - name: SYSADMIN_SIDECAR_URL
              value: "http://localhost:{{ .Values.sidecars.sysadmin.port }}"
            - name: DEVELOPER_SIDECAR_URL
              value: "http://localhost:{{ .Values.sidecars.developer.port }}"
            {{- if .Values.sidecars.qe.enabled }}
            - name: QE_SIDECAR_URL
              value: "http://localhost:{{ .Values.sidecars.qe.port }}"
            {{- end }}
            {{- end }}
            {{- if .Values.qdrant.enabled }}
            - name: QDRANT_URL
              value: "http://{{ .Release.Name }}-qdrant:{{ .Values.qdrant.port }}"
            {{- end }}
            {{- if .Values.knowledgeGraph.enabled }}
            - name: KG_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.knowledgeGraph.secretName | default (printf "%s-kg-postgres" .Release.Name) }}
                  key: password
            - name: KG_POSTGRES_URL
              value: "postgresql://darwin:$(KG_POSTGRES_PASSWORD)@{{ .Release.Name }}-kg-postgres:5432/{{ .Values.knowledgeGraph.database }}"
            {{- end }}
            {{- if .Values.github.existingSecret }}
            # GitHub App configuration
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: app-id
            - name: GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: installation-id
                  optional: true
            - name: GITHUB_PRIVATE_KEY_PATH
              value: "/secrets/github" # Directory -- .pem file discovered dynamically
            - name: GITHUB_BRANCH
              value: "{{ .Values.github.branch }}"
            {{- end }}
            {{- if .Values.gitlab.enabled }}
            # GitLab token configuration
            - name: GITLAB_TOKEN_PATH
              value: "/secrets/gitlab/token"
            - name: GITLAB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitlab.existingSecret }}
                  key: host
            {{- end }}
            # Debug mode
            - name: DEBUG
              value: "{{ .Values.app.debug }}"
            # LLM quota rate limiter (tokens-per-minute)
            - name: LLM_TPM_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_TPM_LIMIT
            # ArgoCD Application Observer (sole discovery, health, and sync source)
            {{- if .Values.argocdObserver.enabled }}
            - name: ARGOCD_OBSERVER_ENABLED
              value: "true"
            - name: ARGOCD_NAME_MAPPING
              value: {{ .Values.argocdObserver.nameMapping | default "" | quote }}
            {{- end }}
            # Kargo Stage Observer
            {{- if .Values.kargoObserver.enabled }}
            - name: KARGO_OBSERVER_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.headhunter }}
            # Headhunter (GitLab todo poller)
            - name: HEADHUNTER_ENABLED
              value: "{{ .Values.headhunter.enabled }}"
            - name: HEADHUNTER_POLL_INTERVAL
              value: "{{ .Values.headhunter.pollInterval }}"
            - name: HEADHUNTER_STARTUP_DELAY
              value: "{{ .Values.headhunter.startupDelay }}"
            - name: HEADHUNTER_MAINTAINER_SOURCE
              value: "{{ .Values.headhunter.maintainerSource }}"
            - name: HEADHUNTER_MAINTAINERS
              value: "{{ .Values.headhunter.maintainers }}"
            - name: HEADHUNTER_COMMENT_LIMIT
              value: "{{ .Values.headhunter.commentLimit }}"
            {{- if .Values.headhunter.github.enabled }}
            - name: HEADHUNTER_GITHUB_ENABLED
              value: "true"
            - name: HEADHUNTER_GITHUB_POLL_INTERVAL
              value: "{{ .Values.headhunter.github.pollInterval }}"
            - name: HEADHUNTER_GITHUB_REPOS
              value: "{{ .Values.headhunter.github.repos }}"
            - name: HEADHUNTER_GITHUB_TRIGGER_REASONS
              value: "{{ .Values.headhunter.github.triggerReasons }}"
            {{- if .Values.headhunter.github.cortexUrl }}
            - name: DARWIN_CORTEX_URL
              value: "{{ .Values.headhunter.github.cortexUrl }}"
            {{- end }}
            - name: HEADHUNTER_GITHUB_LABEL
              value: "{{ .Values.headhunter.github.labelReview }}"
            - name: HEADHUNTER_GITHUB_LABEL_ACTIVE
              value: "{{ .Values.headhunter.github.labelActive }}"
            - name: HEADHUNTER_GITHUB_LABEL_DONE
              value: "{{ .Values.headhunter.github.labelDone }}"
            - name: HEADHUNTER_GITHUB_LABEL_QUEUED
              value: "{{ .Values.headhunter.github.labelQueued }}"
            - name: HEADHUNTER_GITHUB_LABEL_WORK
              value: "{{ .Values.headhunter.github.labelWork }}"
            {{- range $label, $url := .Values.headhunter.github.skills }}
            - name: "HEADHUNTER_GITHUB_SKILL_{{ $label | upper }}"
              value: {{ $url | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.ephemeralAgents.enabled }}
            - name: TEKTON_EVENTLISTENER_URL
              value: "http://el-{{ .Release.Name }}-ephemeral-agent:8080"
            - name: EPHEMERAL_SPAWN_DEADLINE_SEC
              value: {{ .Values.ephemeralAgents.spawnDeadlineSec | quote }}
            - name: EPHEMERAL_POLL_INTERVAL_SEC
              value: {{ .Values.ephemeralAgents.pollIntervalSec | quote }}
            - name: EPHEMERAL_STALL_TIMEOUT_SEC
              value: {{ .Values.ephemeralAgents.stallTimeoutSec | quote }}
            - name: EPHEMERAL_INFRA_DEFER_SEC
              value: {{ .Values.ephemeralAgents.infraDeferSec | quote }}
            - name: EPHEMERAL_MODEL_ARCHITECT
              value: {{ .Values.ephemeralAgents.roleModels.architect | quote }}
            - name: EPHEMERAL_MODEL_SYSADMIN
              value: {{ .Values.ephemeralAgents.roleModels.sysadmin | quote }}
            - name: EPHEMERAL_MODEL_DEVELOPER
              value: {{ .Values.ephemeralAgents.roleModels.developer | quote }}
            - name: EPHEMERAL_MODEL_QE
              value: {{ .Values.ephemeralAgents.roleModels.qe | quote }}
            - name: EPHEMERAL_MODEL_SECURITY
              value: {{ .Values.ephemeralAgents.roleModels.security_analyst | quote }}
            - name: EPHEMERAL_MODEL_CODE_REVIEWER
              value: {{ .Values.ephemeralAgents.roleModels.code_reviewer | quote }}
            - name: EPHEMERAL_EFFORT_ARCHITECT
              value: {{ .Values.ephemeralAgents.roleEffort.architect | quote }}
            - name: EPHEMERAL_EFFORT_SYSADMIN
              value: {{ .Values.ephemeralAgents.roleEffort.sysadmin | quote }}
            - name: EPHEMERAL_EFFORT_DEVELOPER
              value: {{ .Values.ephemeralAgents.roleEffort.developer | quote }}
            - name: EPHEMERAL_EFFORT_QE
              value: {{ .Values.ephemeralAgents.roleEffort.qe | quote }}
            - name: EPHEMERAL_EFFORT_SECURITY
              value: {{ .Values.ephemeralAgents.roleEffort.security_analyst | quote }}
            - name: EPHEMERAL_EFFORT_CODE_REVIEWER
              value: {{ .Values.ephemeralAgents.roleEffort.code_reviewer | quote }}
            - name: EPHEMERAL_MODEL_EXPLORER
              value: {{ .Values.ephemeralAgents.roleModels.explorer | quote }}
            - name: EPHEMERAL_EFFORT_EXPLORER
              value: {{ .Values.ephemeralAgents.roleEffort.explorer | quote }}
            - name: EPHEMERAL_CLI_EXPLORER
              value: {{ .Values.ephemeralAgents.roleCli.explorer | default "claude" | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- if .Values.dex.enabled }}
            - name: DEX_ENABLED
              value: "true"
            - name: DEX_ISSUER_URL
              value: "https://{{ required "route.host is required when dex.enabled=true" .Values.route.host }}/dex"
            - name: DEX_CLIENT_ID
              value: {{ .Values.dex.clientId | quote }}
            - name: DEX_INTERNAL_URL
              value: "https://{{ .Release.Name }}-dex:5556"
            - name: DEX_LOGIN_DISCLAIMER
              value: {{ .Values.dex.loginDisclaimer | quote }}
            {{- end }}
            - name: LLM_MODEL_HEADHUNTER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MODEL_HEADHUNTER
            - name: LLM_TEMPERATURE_HEADHUNTER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_TEMPERATURE_HEADHUNTER
            - name: LLM_THINKING_HEADHUNTER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_THINKING_HEADHUNTER
            - name: LLM_MAX_TOKENS_HEADHUNTER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MAX_TOKENS_HEADHUNTER
            {{- end }}
            {{- if .Values.timekeeper }}
            # TimeKeeper (scheduled task observer)
            - name: TIMEKEEPER_ENABLED
              value: "{{ .Values.timekeeper.enabled }}"
            - name: TIMEKEEPER_POLL_INTERVAL
              value: "{{ .Values.timekeeper.pollInterval }}"
            - name: TIMEKEEPER_MAX_PER_USER
              value: "{{ .Values.timekeeper.maxPerUser }}"
            - name: TIMEKEEPER_MAX_TOTAL
              value: "{{ .Values.timekeeper.maxTotal }}"
            - name: LLM_MODEL_TIMEKEEPER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MODEL_TIMEKEEPER
            - name: LLM_TEMPERATURE_TIMEKEEPER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_TEMPERATURE_TIMEKEEPER
            - name: LLM_MAX_TOKENS_TIMEKEEPER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MAX_TOKENS_TIMEKEEPER
            {{- if .Values.timekeeper.chatStaleTtl }}
            - name: CHAT_STALE_TTL
              value: "{{ .Values.timekeeper.chatStaleTtl }}"
            {{- end }}
            {{- end }}
            {{- if .Values.idleTimeout }}
            # Idle Timeout (chat/slack auto-close)
            - name: IDLE_TIMEOUT_WARNING_SEC
              value: "{{ .Values.idleTimeout.warningSec }}"
            - name: IDLE_TIMEOUT_CLOSE_SEC
              value: "{{ .Values.idleTimeout.closeSec }}"
            - name: IDLE_TIMEOUT_CONVERSATION_SEC
              value: "{{ .Values.idleTimeout.conversationSec }}"
            - name: IDLE_TIMEOUT_CASUAL_SEC
              value: "{{ .Values.idleTimeout.casualSec }}"
            {{- end }}
            {{- if .Values.googleSearch }}
            # Google Search Grounding (function call model)
            - name: GOOGLE_SEARCH_GROUNDING_MODEL
              value: "{{ .Values.googleSearch.model }}"
            {{- end }}
            {{- if .Values.ragEngine }}
            # RAG Engine (JARVIS MemoryCorpus)
            {{- if .Values.ragEngine.jarvis }}
            - name: JARVIS_RAG_CORPUS_ID
              value: {{ .Values.ragEngine.jarvis.corpusId | default "" | quote }}
            - name: JARVIS_RAG_ENABLED
              value: {{ .Values.ragEngine.jarvis.enabled | default false | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.memoryReflex }}
            # Memory Reflex (real-time lesson search during thinking stream)
            - name: BRAIN_MEMORY_REFLEX
              value: "{{ .Values.memoryReflex.enabled }}"
            - name: BRAIN_REFLEX_THRESHOLD
              value: {{ .Values.memoryReflex.threshold | quote }}
            - name: BRAIN_REFLEX_MAX_SEARCHES
              value: {{ .Values.memoryReflex.maxSearches | quote }}
            {{- end }}
            {{- if .Values.cortex }}
            # Cortex (Cognitive Recall Graph -- meta-cognitive observation)
            - name: PULSE_TRACKING_ENABLED
              value: "{{ .Values.cortex.pulseTracking }}"
            {{- if .Values.cortex.system2 }}
            - name: SYSTEM2_ENABLED
              value: "{{ .Values.cortex.system2.enabled }}"
            - name: SYSTEM2_SHADOW
              value: "{{ .Values.cortex.system2.shadow }}"
            - name: SYSTEM2_SESSION_REPORT
              value: "{{ .Values.cortex.system2.sessionReport }}"
            - name: SYSTEM2_HANDOFF_REPORT
              value: "{{ .Values.cortex.system2.handoffReport }}"
            {{- if .Values.cortex.system2.model }}
            - name: LLM_MODEL_SYSTEM2
              value: "{{ .Values.cortex.system2.model }}"
            {{- end }}
            - name: SYSTEM2_MAX_TOKENS
              value: {{ .Values.cortex.system2.maxOutputTokens | default "8192" | quote }}
            {{- if .Values.cortex.system2.location }}
            - name: GCP_LOCATION_SYSTEM2
              value: {{ .Values.cortex.system2.location | quote }}
            {{- end }}
            {{- if .Values.cortex.system2.toolTimeout }}
            - name: SYSTEM2_TOOL_TIMEOUT
              value: {{ .Values.cortex.system2.toolTimeout | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.nightwatcher }}
            # Nightwatcher (shift consolidation agent)
            - name: NIGHTWATCHER_ENABLED
              value: "{{ .Values.nightwatcher.enabled }}"
            - name: NIGHTWATCHER_SWEEP_CRON
              value: "{{ .Values.nightwatcher.sweepCron }}"
            - name: NIGHTWATCHER_MIN_PENDING
              value: "{{ .Values.nightwatcher.minPending }}"
            - name: NIGHTWATCHER_DISPATCH_CAP
              value: "{{ .Values.nightwatcher.dispatchCap }}"
            - name: NIGHTWATCHER_BATCH_SIZE
              value: "{{ .Values.nightwatcher.batchSize }}"
            - name: NIGHTWATCHER_MAX_BATCHES
              value: "{{ .Values.nightwatcher.maxBatches }}"
            - name: NIGHTWATCHER_BATCH_COOLDOWN_SECONDS
              value: "{{ .Values.nightwatcher.batchCooldownSeconds }}"
            - name: NIGHTWATCHER_BATCH_TIMEOUT_SECONDS
              value: '{{ .Values.nightwatcher.batchTimeoutSeconds | default "1800" }}'
            - name: LLM_MODEL_NIGHTWATCHER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MODEL_NIGHTWATCHER
            - name: LLM_TEMPERATURE_NIGHTWATCHER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_TEMPERATURE_NIGHTWATCHER
            - name: LLM_THINKING_NIGHTWATCHER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_THINKING_NIGHTWATCHER
            - name: LLM_MAX_TOKENS_NIGHTWATCHER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MAX_TOKENS_NIGHTWATCHER
            {{- end }}
            {{- if .Values.jenkinsObserver }}
            {{- if .Values.jenkinsObserver.versions }}
            {{- fail "jenkinsObserver.versions was renamed to jenkinsObserver.views (CSV of Jenkins view names, e.g. \"Gating Wrappers\" -- not CNV versions). Update your values/GitOps overlay; the old key is otherwise silently ignored and JENKINS_OBSERVER_VIEWS resolves empty." }}
            {{- end }}
            {{- if and .Values.jenkinsObserver.enabled (not .Values.jenkinsObserver.views) }}
            {{- fail "jenkinsObserver.enabled=true requires jenkinsObserver.views to be set (CSV of Jenkins view names) -- otherwise CI gating discovery runs completely dark with no alert." }}
            {{- end }}
            # JenkinsObserver (CI gating reconciliation)
            - name: JENKINS_OBSERVER_ENABLED
              value: "{{ .Values.jenkinsObserver.enabled }}"
            - name: JENKINS_OBSERVER_DRY_RUN
              value: "{{ .Values.jenkinsObserver.dryRun }}"
            - name: JENKINS_OBSERVER_POLL_INTERVAL
              value: "{{ .Values.jenkinsObserver.pollInterval }}"
            - name: JENKINS_OBSERVER_STARTUP_DELAY
              value: "{{ .Values.jenkinsObserver.startupDelay }}"
            - name: JENKINS_OBSERVER_DWELL_SECONDS
              value: "{{ .Values.jenkinsObserver.dwellSeconds }}"
            - name: JENKINS_OBSERVER_FLOOD_THRESHOLD
              value: "{{ .Values.jenkinsObserver.floodThreshold }}"
            - name: JENKINS_OBSERVER_VIEWS
              value: "{{ .Values.jenkinsObserver.views }}"
            - name: JENKINS_OBSERVER_RECENCY_HOURS
              value: "{{ .Values.jenkinsObserver.recencyHours }}"
            - name: JENKINS_OBSERVER_MAINTAINERS
              value: "{{ .Values.jenkinsObserver.maintainers }}"
            - name: JENKINS_OBSERVER_TRIGGER_STATES
              value: "{{ .Values.jenkinsObserver.triggerStates }}"
            - name: JENKINS_OBSERVER_ANALYSIS_ENABLED
              value: "{{ .Values.jenkinsObserver.analysisEnabled }}"
            {{- if .Values.jenkinsObserver.jenkins }}
            - name: JENKINS_URL
              value: "{{ .Values.jenkinsObserver.jenkins.url }}"
            - name: JENKINS_INSECURE_TLS
              value: "{{ .Values.jenkinsObserver.jenkins.insecureTls }}"
            - name: JENKINS_TIMEOUT
              value: "{{ .Values.jenkinsObserver.jenkins.timeout }}"
            - name: JENKINS_CIRCUIT_BREAKER_THRESHOLD
              value: "{{ .Values.jenkinsObserver.jenkins.circuitBreakerThreshold }}"
            - name: JENKINS_CIRCUIT_BREAKER_COOLDOWN
              value: "{{ .Values.jenkinsObserver.jenkins.circuitBreakerCooldown }}"
            - name: JENKINS_RETRIGGER_COOLDOWN_SECONDS
              value: "{{ .Values.jenkinsObserver.jenkins.retriggerCooldownSeconds }}"
            {{- if .Values.jenkinsObserver.jenkins.existingSecret }}
            - name: JENKINS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jenkinsObserver.jenkins.existingSecret }}
                  key: username
            - name: JENKINS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jenkinsObserver.jenkins.existingSecret }}
                  key: api-token
            {{- end }}
            {{- end }}
            {{- if .Values.jenkinsObserver.skillsCatalog }}
            - name: SKILLS_CATALOG_URL
              value: "{{ .Values.jenkinsObserver.skillsCatalog.url }}"
            - name: SKILLS_CATALOG_SKILLS
              value: "{{ .Values.jenkinsObserver.skillsCatalog.skills }}"
            {{- end }}
            {{- if .Values.jenkinsObserver.releaseAi }}
            - name: RELEASE_AI_URL
              value: "{{ .Values.jenkinsObserver.releaseAi.url }}"
            {{- if .Values.jenkinsObserver.releaseAi.email }}
            - name: RELEASE_AI_EMAIL
              value: "{{ .Values.jenkinsObserver.releaseAi.email }}"
            {{- end }}
            {{- if .Values.jenkinsObserver.releaseAi.existingSecret }}
            - name: RELEASE_AI_BFF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jenkinsObserver.releaseAi.existingSecret }}
                  key: bff-token
            {{- end }}
            {{- end }}
            - name: LLM_MODEL_JENKINS_OBSERVER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MODEL_JENKINS_OBSERVER
            - name: LLM_TEMPERATURE_JENKINS_OBSERVER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_TEMPERATURE_JENKINS_OBSERVER
            - name: LLM_MAX_TOKENS_JENKINS_OBSERVER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LLM_MAX_TOKENS_JENKINS_OBSERVER
            {{- end }}
            {{- if and .Values.slack.enabled .Values.slack.existingSecret }}
            # Slack integration (Socket Mode)
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.slack.existingSecret }}
                  key: bot-token
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.slack.existingSecret }}
                  key: app-token
            - name: SLACK_INFRA_CHANNEL
              value: {{ .Values.slack.channels.infrastructure | quote }}
            - name: SLACK_MR_CHANNEL
              value: {{ .Values.slack.channels.mrFallback | quote }}
            {{- if .Values.slack.workspaceDomain }}
            - name: SLACK_WORKSPACE_DOMAIN
              value: {{ .Values.slack.workspaceDomain | quote }}
            {{- end }}
            - name: SLACK_PROGRESS_ENABLED
              value: {{ .Values.slack.progress.enabled | quote }}
            {{- end }}
            {{- if .Values.slackAccess.enabled }}
            # Slack Access Gate (OCP Group-based)
            - name: SLACK_ACCESS_ENABLED
              value: "true"
            - name: SLACK_ACCESS_GROUPS
              value: {{ .Values.slackAccess.groups | quote }}
            - name: SLACK_ACCESS_EMAIL_DOMAIN
              value: {{ .Values.slackAccess.emailDomain | quote }}
            - name: SLACK_ACCESS_SYNC_INTERVAL
              value: {{ .Values.slackAccess.syncIntervalSeconds | default 300 | quote }}
            {{- if .Values.slackAccess.existingSecret }}
            - name: SLACK_ACCESS_MAINTAINER_EMAILS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.slackAccess.existingSecret }}
                  key: maintainer-emails
            {{- end }}
            {{- end }}
            {{- if .Values.obsAdmin.groups }}
            - name: OBS_ADMIN_GROUPS
              value: {{ .Values.obsAdmin.groups | quote }}
            {{- end }}
            {{- if .Values.trustedProxy.existingSecret }}
            # Trusted Proxy (Generic WS Clients / External BFF auth)
            - name: TRUSTED_PROXY_ENABLED
              value: "true"
            - name: TRUSTED_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.trustedProxy.existingSecret }}
                  key: secret
            {{- end }}
            {{- if and .Values.jira.enabled .Values.jira.existingSecret }}
            # Jira Integration (Headhunter Jira Head)
            - name: JIRA_URL
              value: {{ .Values.jira.url | quote }}
            - name: JIRA_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jira.existingSecret }}
                  key: email
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jira.existingSecret }}
                  key: api-token
            - name: HEADHUNTER_JIRA_BOT_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jira.existingSecret }}
                  key: bot-account-id
            - name: HEADHUNTER_JIRA_LABEL
              value: {{ .Values.jira.label | quote }}
            - name: LLM_MODEL_HEADHUNTER_JIRA
              value: {{ .Values.jira.model | quote }}
            {{- range $label, $url := .Values.jira.skills }}
            - name: HEADHUNTER_JIRA_SKILL_{{ $label | upper }}
              value: {{ $url | quote }}
            {{- end }}
            {{- if .Values.jira.incident.enabled }}
            # Jira Incident Tracking (Nightwatcher + Brain escalation)
            - name: JIRA_INCIDENT_PROJECT_KEY
              value: {{ .Values.jira.incident.projectKey | quote }}
            - name: JIRA_INCIDENT_ISSUE_TYPE
              value: {{ .Values.jira.incident.issueType | quote }}
            - name: JIRA_INCIDENT_LABELS
              value: {{ .Values.jira.incident.labels | quote }}
            - name: JIRA_INCIDENT_COMPONENTS
              value: {{ .Values.jira.incident.components | quote }}
            - name: JIRA_INCIDENT_LABEL_FILTER
              value: {{ .Values.jira.incident.labelFilter | quote }}
            - name: JIRA_INCIDENT_PLATFORMS
              value: {{ .Values.jira.incident.platforms | quote }}
            - name: JIRA_INCIDENT_PRIORITIES
              value: {{ .Values.jira.incident.priorities | quote }}
            - name: JIRA_INCIDENT_STATUSES
              value: {{ .Values.jira.incident.statuses | quote }}
            - name: JIRA_INCIDENT_SEVERITY_FIELD
              value: {{ .Values.jira.incident.severityField | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.gcp.existingSecret }}
            # GCP Service Account credentials
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/var/secrets/google/service-account.json"
            {{- end }}
          volumeMounts:
            {{- if .Values.gcp.existingSecret }}
            - name: gcp-sa-key
              mountPath: /var/secrets/google
              readOnly: true
            {{- end }}
            {{- if .Values.github.existingSecret }}
            - name: github-app-secret
              mountPath: /secrets/github
              readOnly: true
            - name: git-credentials
              mountPath: /tmp/git-creds
            {{- end }}
            {{- if .Values.gitlab.enabled }}
            - name: gitlab-token-secret
              mountPath: /secrets/gitlab
              readOnly: true
            {{- end }}
            {{- if .Values.registry.enabled }}
            - name: registry-secret
              mountPath: /secrets/registry
              readOnly: true
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
        
        # Redis moved to standalone Deployment (redis-deployment.yaml)
        
        # Qdrant moved to standalone Deployment (qdrant-deployment.yaml)
        
        # =================================================================
        # Skill Reconciler Sidecar (Git-to-Redis hot-reload)
        # =================================================================
        {{- if .Values.skillReconciler.enabled }}
        - name: skill-reconciler
          image: "{{ .Values.skillReconciler.image | default (printf "%s:%s" .Values.image.repository .Values.image.tag) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "src/skill_reconciler/reconcile.py"]
          env:
            - name: SKILL_RECONCILER_POLL_INTERVAL
              value: "{{ .Values.skillReconciler.pollInterval }}"
            - name: SKILL_RECONCILER_GIT_PROVIDER
              value: "{{ .Values.skillReconciler.gitProvider }}"
            - name: SKILL_RECONCILER_REPO
              value: "{{ .Values.skillReconciler.repo }}"
            - name: SKILL_RECONCILER_BRANCH
              value: "{{ .Values.skillReconciler.branch }}"
            - name: SKILL_RECONCILER_SKILLS_PATH
              value: "{{ .Values.skillReconciler.skillsPath }}"
            - name: REDIS_HOST
              value: "{{ .Values.redis.host | default (printf "%s-redis" .Release.Name) }}"
            - name: REDIS_PORT
              value: "{{ .Values.redis.port | default 6379 }}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: password
            {{- if .Values.github.existingSecret }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: app-id
            - name: GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: installation-id
                  optional: true
            - name: GITHUB_PRIVATE_KEY_PATH
              value: "/secrets/github"
            {{- end }}
            {{- if .Values.gitlab.enabled }}
            - name: GITLAB_TOKEN_PATH
              value: "/secrets/gitlab/token"
            - name: GITLAB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitlab.existingSecret }}
                  key: host
            {{- end }}
          volumeMounts:
            {{- if .Values.github.existingSecret }}
            - name: github-app-secret
              mountPath: /secrets/github
              readOnly: true
            {{- end }}
            {{- if .Values.gitlab.enabled }}
            - name: gitlab-token-secret
              mountPath: /secrets/gitlab
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.skillReconciler.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        {{- end }}
      volumes:
        {{- if .Values.gcp.existingSecret }}
        - name: gcp-sa-key
          secret:
            secretName: {{ .Values.gcp.existingSecret }}
        {{- end }}
        {{- if .Values.github.existingSecret }}
        - name: github-app-secret
          secret:
            secretName: {{ .Values.github.existingSecret }}
        - name: git-credentials
          emptyDir: {}
        {{- end }}
        {{- if .Values.gitlab.enabled }}
        - name: gitlab-token-secret
          secret:
            secretName: {{ .Values.gitlab.existingSecret | default (printf "%s-gitlab" .Release.Name) }}
        {{- end }}
        {{- if .Values.registry.enabled }}
        - name: registry-secret
          secret:
            secretName: {{ .Values.registry.existingSecret | default (printf "%s-registry" .Release.Name) }}
        {{- end }}
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

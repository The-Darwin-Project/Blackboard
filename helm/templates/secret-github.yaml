# BlackBoard/helm/templates/secret-github.yaml
# GitHub App -- requires existingSecret when headhunter.github.enabled=true (no placeholder fallback)
{{- $hh := .Values.headhunter | default dict -}}
{{- $hhGh := $hh.github | default dict -}}
{{- if eq (lower (trim (toString ($hhGh.enabled | default false)))) "true" -}}
{{- $gh := .Values.github | default dict -}}
{{- if not (trim (toString ($gh.existingSecret | default ""))) -}}
{{- fail "headhunter.github.enabled=true requires github.existingSecret to be set (pre-created secret with 'app-id', 'installation-id', and private key '.pem')" -}}
{{- end -}}
{{- end -}}

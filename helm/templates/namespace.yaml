# BlackBoard/helm/templates/namespace.yaml
# Creates the target namespace when global.namespace is set.
# Tekton Operator pruner: namespace ANNOTATIONS control per-ns cleanup.
# Ref: https://tekton.dev/vault/operator-v0.74.x-lts/tektonconfig/#pruner
{{- if .Values.global.namespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespace }}
  labels:
    {{- include "darwin.labels" . | nindent 4 }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/resource-policy: keep
    {{- if .Values.ephemeralAgents.enabled }}
    {{- $cleanup := .Values.ephemeralAgents.cleanup | default dict }}
    {{- $strategy := trim (toString ($cleanup.strategy | default "")) | default "keep-since" }}
    operator.tekton.dev/prune.resources: "taskrun"
    operator.tekton.dev/prune.strategy: {{ $strategy | quote }}
    {{- if eq $strategy "keep-since" }}
    {{- $keepSince := "1440" }}
    {{- if and (hasKey $cleanup "keepSince") (not (kindIs "invalid" $cleanup.keepSince)) (ne (trim (toString $cleanup.keepSince)) "") }}
    {{- $keepSince = trim (toString $cleanup.keepSince) }}
    {{- end }}
    operator.tekton.dev/prune.keep-since: {{ $keepSince | quote }}
    {{- else }}
    {{- $keep := "5" }}
    {{- if and (hasKey $cleanup "keep") (not (kindIs "invalid" $cleanup.keep)) (ne (trim (toString $cleanup.keep)) "") }}
    {{- $keep = trim (toString $cleanup.keep) }}
    {{- end }}
    operator.tekton.dev/prune.keep: {{ $keep | quote }}
    {{- end }}
    operator.tekton.dev/prune.schedule: {{ trim (toString ($cleanup.schedule | default "")) | default "0 */6 * * *" | quote }}
    {{- end }}
{{- end }}

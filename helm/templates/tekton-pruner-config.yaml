# BlackBoard/helm/templates/tekton-pruner-config.yaml
# Standalone Tekton Pruner ConfigMap -- fallback when chart does NOT own the Namespace.
# Uses Resource Groups to target only darwin ephemeral-agent TaskRuns by label selector.
# Ref: https://tekton.dev/docs/pruner/#resource-groups-fine-grained-control
{{- if and .Values.ephemeralAgents.enabled (not .Values.global.namespace) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tekton-pruner-namespace-spec
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "darwin.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tekton-pruner
    pruner.tekton.dev/config-type: namespace
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  ns-config: |
    taskRuns:
      - selector:
        - matchLabels:
            app.kubernetes.io/component: ephemeral-agent
    {{- $cleanup := .Values.ephemeralAgents.cleanup | default dict }}
    {{- $strategy := trim (toString ($cleanup.strategy | default "")) | default "keep-since" }}
    {{- if eq $strategy "keep-since" }}
    {{- $keepSince := "1440" }}
    {{- if and (hasKey $cleanup "keepSince") (not (kindIs "invalid" $cleanup.keepSince)) (ne (trim (toString $cleanup.keepSince)) "") }}
    {{- $keepSince = trim (toString $cleanup.keepSince) }}
    {{- end }}
        ttlSecondsAfterFinished: {{ mul ($keepSince | int) 60 }}
    {{- else }}
    {{- $keep := "5" }}
    {{- if and (hasKey $cleanup "keep") (not (kindIs "invalid" $cleanup.keep)) (ne (trim (toString $cleanup.keep)) "") }}
    {{- $keep = trim (toString $cleanup.keep) }}
    {{- end }}
        historyLimit: {{ $keep | int }}
    {{- end }}
{{- end }}

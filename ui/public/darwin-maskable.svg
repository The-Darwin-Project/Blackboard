<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Loop Gradient -->
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Diffuse Ambient Light -->
    <radialGradient id="ambientGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Bloom Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#ambientGlow)"/>

  <!-- Swarm Network Nodes / Constellation -->
  <g opacity="0.35">
    <circle cx="140" cy="120" r="4" fill="#38bdf8"/>
    <circle cx="380" cy="130" r="3.5" fill="#c084fc"/>
    <circle cx="395" cy="370" r="4" fill="#06b6d4"/>
    <circle cx="130" cy="385" r="3.5" fill="#818cf8"/>
    <line x1="140" y1="120" x2="180" y2="150" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="380" y1="130" x2="340" y2="170" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Ambient Glow Behind Core -->
  <circle cx="280" cy="256" r="145" fill="url(#sparkGlow)"/>

  <!-- Scaled slightly for maskable safe zone (85%) -->
  <g transform="translate(38, 38) scale(0.85)">
    <!-- Darwin Monogram "D" & Neural Aperture -->
    <g filter="url(#glowEffect)">
      <!-- Vertical Backbone / Cyber Stem -->
      <rect x="156" y="136" width="44" height="240" rx="22" fill="url(#stemGrad)"/>
      
      <!-- Outer Sweep of 'D' -->
      <path d="M 180 136 
               H 272 
               C 365 136, 404 188, 404 256 
               C 404 324, 365 376, 272 376 
               H 180" 
            fill="none" 
            stroke="url(#loopGrad)" 
            stroke-width="44" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Inner Cognitive Spark (Diamond & Pulse Core) -->
      <g transform="translate(282, 256)">
        <path d="M 0 -38 Q 0 0 -38 0 Q 0 0 0 38 Q 0 0 38 0 Q 0 0 0 -38 Z" fill="#ffffff"/>
        <circle cx="0" cy="0" r="10.5" fill="#38bdf8"/>
      </g>
    </g>

    <!-- Crisp Precision Accent Terminals -->
    <circle cx="272" cy="136" r="7.5" fill="#ffffff"/>
    <circle cx="272" cy="376" r="7.5" fill="#ffffff"/>
    <circle cx="178" cy="158" r="5" fill="#ffffff"/>
  </g>
</svg>

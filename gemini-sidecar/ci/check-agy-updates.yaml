# gemini-sidecar/ci/check-agy-updates.yaml
# Scheduled weekly check for Antigravity CLI (agy) updates.
# If an upstream release is available, updates Dockerfile, runs test suites,
# and creates a pull request.

name: Check Antigravity CLI Updates

on:
  schedule:
    - cron: "0 4 * * 1" # Weekly every Monday at 04:00 UTC
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check and apply agy updates
        id: update
        working-directory: gemini-sidecar
        run: |
          npm run update-agy
          if git diff --quiet Dockerfile; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "No agy version update detected."
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            NEW_VERSION=$(grep -E '^ARG AGY_VERSION=' Dockerfile | cut -d'"' -f2)
            echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
            echo "Detected update to agy ${NEW_VERSION}."
          fi

      - name: Run test suite on updated configuration
        if: steps.update.outputs.updated == 'true'
        working-directory: gemini-sidecar
        run: |
          npm ci
          npm test

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Antigravity CLI (agy) to ${{ steps.update.outputs.version }}"
          title: "chore(deps): update Antigravity CLI to ${{ steps.update.outputs.version }}"
          branch: "update-agy-${{ steps.update.outputs.version }}"
          delete-branch: true
          labels: |
            dependencies
            darwin-review
          body: |
            ## Automated Antigravity CLI Update

            Updates `gemini-sidecar/Dockerfile` to Antigravity CLI (agy) version `${{ steps.update.outputs.version }}`.

            - Pinned version, tarball URL, and SHA512 hash refreshed from canonical upstream manifest.
            - Local test suite (`npm test`) passed.

            ### Bot Instructions
            **On pipeline success**: Wait for the CI reviewer (ai-review) comment and review findings. If HIGH findings remain, fix them in the same branch, push, and wait for the next CI reviewer pass (repeat until clean). Only merge when no HIGH findings remain.
            **On pipeline failure**: Investigate the failure, fix in the same branch, and push again.
